<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GuardBot — Вход</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0f14;
      --surface: #16181f;
      --surface2: #1e2029;
      --border: rgba(255,255,255,0.07);
      --accent: #5865f2;
      --accent-hover: #4752c4;
      --text: #e8eaf0;
      --text-muted: #6b7280;
      --blurple: #5865f2;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Animated background */
    .bg-glow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .bg-glow::before {
      content: '';
      position: absolute;
      top: -30%;
      left: -20%;
      width: 60%;
      height: 60%;
      background: radial-gradient(circle, rgba(88,101,242,0.18) 0%, transparent 70%);
      animation: drift1 12s ease-in-out infinite alternate;
    }
    .bg-glow::after {
      content: '';
      position: absolute;
      bottom: -30%;
      right: -20%;
      width: 50%;
      height: 50%;
      background: radial-gradient(circle, rgba(114,137,218,0.12) 0%, transparent 70%);
      animation: drift2 16s ease-in-out infinite alternate;
    }
    @keyframes drift1 { to { transform: translate(5%, 8%); } }
    @keyframes drift2 { to { transform: translate(-5%, -8%); } }

    .login-card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      backdrop-filter: blur(12px);
      box-shadow: 0 32px 64px rgba(0,0,0,0.5);
      animation: fadeUp 0.5s cubic-bezier(0.22,1,0.36,1);
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #5865f2, #7289da);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 24px;
      box-shadow: 0 8px 24px rgba(88,101,242,0.4);
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 36px;
      line-height: 1.6;
    }

    .btn-discord {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 14px 24px;
      background: var(--blurple);
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 16px rgba(88,101,242,0.35);
    }
    .btn-discord:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(88,101,242,0.5);
    }
    .btn-discord:active { transform: translateY(0); }

    .btn-discord svg { flex-shrink: 0; }

    .error-msg {
      margin-top: 16px;
      padding: 10px 16px;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 8px;
      color: #f87171;
      font-size: 13px;
      display: none;
    }
    .error-msg.visible { display: block; }

    .footer {
      margin-top: 32px;
      color: var(--text-muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="login-card">
    <div class="logo">🛡</div>
    <h1>GuardBot Panel</h1>
    <p class="subtitle">Войдите через аккаунт Discord, чтобы получить доступ к панели администратора.</p>

    <a id="login-btn" class="btn-discord" href="/auth/discord">
      <svg width="20" height="20" viewBox="0 0 71 55" fill="white" xmlns="http://www.w3.org/2000/svg">
        <path d="M60.1 4.9C55.5 2.7 50.6 1.1 45.5 0.3c-0.7 1.2-1.4 2.8-1.9 4.1-5.4-0.8-10.8-0.8-16.1 0-0.5-1.3-1.3-2.9-2-4.1C20.4 1.1 15.5 2.7 10.9 4.9 1.6 18.7-1 32.2 0.3 45.5c5.7 4.2 11.2 6.7 16.6 8.4 1.3-1.8 2.5-3.7 3.5-5.7-1.9-0.7-3.8-1.6-5.5-2.7 0.5-0.3 0.9-0.7 1.4-1 10.7 4.9 22.3 4.9 32.9 0 0.5 0.3 0.9 0.7 1.4 1-1.7 1.1-3.6 2-5.5 2.7 1 2 2.2 3.9 3.5 5.7 5.4-1.7 10.9-4.2 16.6-8.4C61 32.2 58.4 18.7 60.1 4.9zM23.7 37.3c-3.5 0-6.4-3.2-6.4-7.1s2.8-7.1 6.4-7.1 6.5 3.2 6.4 7.1C30.1 34.1 27.3 37.3 23.7 37.3zm23.6 0c-3.5 0-6.4-3.2-6.4-7.1s2.8-7.1 6.4-7.1 6.5 3.2 6.4 7.1C53.7 34.1 50.9 37.3 47.3 37.3z"/>
      </svg>
      Войти через Discord
    </a>

    <div class="error-msg" id="error-msg">
      ⛔ Доступ запрещён. Ваш аккаунт не в списке администраторов.
    </div>

    <p class="footer">Доступ только для авторизованных администраторов.</p>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    if (params.get('error')) {
      document.getElementById('error-msg').classList.add('visible');
    }
  </script>
</body>
</html>
